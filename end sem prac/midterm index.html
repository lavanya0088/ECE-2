<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .body {
    font-family: Arial, sans-serif;
    margin: 40px;
    text-align: left;
}

.h1 {
    margin-bottom: 40px;
}

.h2 {
    text-align: left;
    margin-top: 40px;
}

.block-menu a {
    display: block;
    background-color: #3498db;
    color: white;
    padding: 10px;
    margin: 5px;
}

.inline-menu a {
    display: inline;
    background-color: #24f544;
    color: white;
    padding: 8px 14px;
    margin: 5px;
}

.inlineblock-menu a {
    display: inline-block;
    background: #9b59b6;
    color: white;
    padding: 12px 20px;
    margin-right: 8px;
    text-decoration: none;
    margin: 5px;
}

.float-menu a {
    float: left;
    background: #e67e22;
    color: white;
    padding: 12px 18px;
    margin-right: 10px;
    text-decoration: none;
    }
  </style>
  <title>Navigation Menu Example</title>
</head>
<body>

  <h1 align="center">Navigation Menu Demo</h1>

  <!-- Block Example -->
  <h2>Block Example</h2>
  <div class="block-menu">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <!-- Inline Example -->
  <h2>Inline Example</h2>
  <div class="inline-menu">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <!-- Inline-Block Example -->
  <h2>Inline-Block Example</h2>
  <div class="inline-block-menu">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <!-- Float Example -->
  <h2>Float Example</h2>
  <div class="float-menu">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
    <!-- Clear Example -->
  <div class="clear-example">
    <p>This text comes <b>after</b> clearing floats.  
    It will appear below the orange menu above.</p>
  </div>

</body>
</html>
